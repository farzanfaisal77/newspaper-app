{%extends "base.html"%}
{%load crispy_forms_tags%}

{%block title%}Password Change{%endblock title%}

{%block content%}
<h1>Password Change!!!</h1>
<p>Please enter your old password and new password twice!</p>
<form action="" method=post>{%csrf_token%}
    {{form | crispy}}
    <input type="submit" class='btn btn-success ml-2' value='Change Password'>
</form>
{%endblock content%}
