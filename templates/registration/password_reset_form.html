{%extends "base.html"%}
{%load crispy_forms_tags%}

{%block title%}Forgot your password?{%endblock title%}

{%block content%}
    <h1>Forgot your password?</h1>
    <p>Enter email address below to help reset password</p>
    <form action="" method=post>{%csrf_token%}
        {{form | crispy}}
        <button type="submit" class="btn btn-success ml-2">Send Email</button>
    </form>
{%endblock content%}
